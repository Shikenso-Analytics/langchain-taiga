[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "langchain-taiga"
version = "2.1.0"
description = "Python toolkit that lets your LangChain agents automate Taiga: create, search, edit & comment on user stories, tasks and issues via the official REST API. v2 introduces the multi-tenant remote MCP mode (HTTP+OAuth) alongside the existing stdio transport."
authors = []
readme = "README.md"
repository = "https://github.com/Shikenso-Analytics/langchain-taiga"
license = "MIT"

[tool.mypy]
disallow_untyped_defs = "True"

packages = [
    { include = "langchain_taiga" }
]
include = ["langchain_taiga/auth/templates/*.html"]

[tool.poetry.urls]
"Source Code" = "https://github.com/Shikenso-Analytics/langchain-taiga"
"Release Notes" = "https://github.com/Shikenso-Analytics/langchain-taiga/releases"

[tool.poetry.scripts]
langchain-taiga-mcp = "langchain_taiga.mcp_server:main"
langchain-taiga-mcp-remote = "langchain_taiga.remote_server:main"

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
langchain-core = "^1.2.0"
python-taiga = "^1.3.2"
cachetools = ">=5.5.2,<7.0.0"
python-dotenv = "^1.1.0"
langchain-ollama = "^1.0.0"
langchain-openai = "^1.1.0"
fastmcp = ">=2.14.0,<3.0.0"
httpx = ">=0.27,<1.0"
jinja2 = "^3.1"

[tool.ruff.lint]
select = ["E", "F", "I", "T201"]

[tool.coverage.run]
omit = ["tests/*"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --durations=5"
markers = [
    "compile: mark placeholder test used to compile integration tests without running them",
]
asyncio_mode = "auto"

[tool.poetry.group.test]
optional = true

[tool.poetry.group.codespell]
optional = true

[tool.poetry.group.test_integration]
optional = true

[tool.poetry.group.lint]
optional = true

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]

[tool.poetry.group.test.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.23.2"
pytest-socket = "^0.7.0"
pytest-watcher = "^0.3.4"
langchain-tests = ">=0.3.22"
respx = ">=0.22,<0.24"
responses = "^0.25"
httpx = ">=0.27,<1.0"

[tool.poetry.group.codespell.dependencies]
codespell = "^2.2.6"

[tool.poetry.group.test_integration.dependencies]

[tool.poetry.group.lint.dependencies]
ruff = "^0.5"

[tool.poetry.group.typing.dependencies]
mypy = "^1.10"
